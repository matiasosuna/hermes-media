# Prueba de carga de la sala de video (tarot-web), sin gente real (Matías, 14/11/2026: «Probala vos»).
# 18 Chrome headless (anfitrión + 17 alumnos) contra la sala real con D1 en memoria y el Realtime de PREVIEW: no toca
# producción ni la D1 compartida. Repartidos en 4 máquinas por versión (en una sola, 18 Chrome la saturaban): la «sala»
# tiene el servidor, un túnel de Cloudflare (protegido con PRUEBA_TOKEN, sacado del secreto) y el director; g1–g3 abren
# el resto. Red de lejos con tc netem (solo UDP) en cada máquina. Se comparan versiones con la misma red y señalización.
# Repo público: los logs y los artefactos solo tienen números (y la URL del túnel, que sin el token no abre nada);
# el código de tarot-web se baja con PRIVADO_TOKEN solo en la máquina «sala» y no se sube a ningún lado.
name: prueba-sala
on:
  push:
    branches: [prueba-sala]
    paths: ['prueba-sala/**', '.github/workflows/prueba-sala.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: prueba-sala
  cancel-in-progress: true
jobs:
  carga:
    strategy:
      fail-fast: false
      matrix:
        v:
          # 26/11/2026 (Matías: «probala»): una hora con 25 personas antes de cobrar eventos en la sala; 2 máquinas de celular lento
          - { nombre: larga-25, ref: main, n: '24', grupos: '0-2,3-5,6-8,9-11,12-14,15-17,18-20,21-24', retardo: '200', jitter: '10', perdida: '3', celulares: '6,7', larga: '1' }
        rol: [sala, g1, g2, g3, g4, g5, g6, g7]
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      REALTIME_CLUB_APP_SECRET: ${{ secrets.REALTIME_CLUB_APP_SECRET }}
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ matrix.v.nombre }}
      SIN_DTX: ${{ matrix.v.sin_dtx || '' }}
      CELULARES: ${{ matrix.v.celulares || '' }}
      SIN_D: ${{ matrix.v.sin_d || '' }}
      LARGA: ${{ matrix.v.larga || '' }}
      MEDIA: ${{ matrix.v.media || '' }}
      N: ${{ matrix.v.n }}
      GRUPOS: ${{ matrix.v.grupos }}
      ESCALA: '1'
      REQ_MS: '20'
      D1_MS: '150'
      RETARDO: ${{ matrix.v.retardo }}
      JITTER: ${{ matrix.v.jitter }}
      PERDIDA: ${{ matrix.v.perdida }}
      RED: 'RTT ~${{ matrix.v.retardo }} ms, ${{ matrix.v.perdida }} % de pérdida entre dos personas, jitter ±${{ matrix.v.jitter }} ms, solo UDP'
    steps:
      - uses: actions/checkout@v4
      - name: Clave de la prueba
        run: |
          T=$(printf %s "$REALTIME_CLUB_APP_SECRET-$GITHUB_RUN_ID-$VERSION" | sha256sum | cut -c1-32)
          echo "::add-mask::$T"; echo "PRUEBA_TOKEN=$T" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        if: matrix.rol == 'sala'
        with:
          repository: matiasosuna/tarot-web
          ref: ${{ matrix.v.ref }}
          path: web
          token: ${{ secrets.PRIVADO_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Dependencias (puppeteer-core con el Chrome del runner)
        working-directory: prueba-sala
        run: npm init -y >/dev/null && npm i --no-audit --no-fund puppeteer-core@23.11.1 ws@8.18.0 >/dev/null && google-chrome --version
      - name: Red de lejos (netem)
        run: |
          R="${{ matrix.rol }}"; TASA=""
          # máquinas que hacen de celular: 4G flojo, más pérdida y subida con tope (≈1 Mbps por persona)
          if [ "$R" != sala ] && [[ ",$CELULARES," == *",${R#g},"* ]]; then PERDIDA=5; TASA=3000kbit; fi
          echo "PERDIDA=$PERDIDA" >> "$GITHUB_ENV"; echo "TASA=$TASA" >> "$GITHUB_ENV"
          sudo env RETARDO="$RETARDO" JITTER="$JITTER" PERDIDA="$PERDIDA" TASA="$TASA" bash prueba-sala/red.sh
      - name: Sala de prueba y túnel
        if: matrix.rol == 'sala'
        run: |
          node prueba-sala/server.mjs "$GITHUB_WORKSPACE/web" 8798 "$N" > servidor.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8798/control/hora -H "x-prueba: $PRUEBA_TOKEN" && break; sleep 1; done
          head -3 servidor.log
          curl -sL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 && chmod +x cloudflared
          ./cloudflared --version
          # el túnel gratis a veces responde 429 (26/11/2026): hasta 6 intentos, con espera entre uno y otro
          U=""
          for intento in 1 2 3 4 5 6; do
            ./cloudflared tunnel --no-autoupdate --protocol http2 --url http://127.0.0.1:8798 > tunel.log 2>&1 &
            T=$!
            for i in $(seq 1 60); do U=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' tunel.log | head -1); [ -n "$U" ] && break; kill -0 $T 2>/dev/null || break; sleep 1; done
            [ -n "$U" ] && break
            tail -3 tunel.log; kill $T 2>/dev/null || true; echo "túnel: intento $intento falló"; sleep $((intento * 30))
          done
          [ -n "$U" ] || { tail -20 tunel.log; exit 1; }
          for i in $(seq 1 60); do [ "$(curl -s -o /dev/null -w '%{http_code}' "$U/control/hora" -H "x-prueba: $PRUEBA_TOKEN")" = 200 ] && break; sleep 2; done
          mkdir -p tunel && echo "$U" > tunel/url && echo "túnel listo"
      - uses: actions/upload-artifact@v4
        if: matrix.rol == 'sala'
        with: { name: 'tunel-${{ matrix.v.nombre }}', path: tunel/url }
      - name: Buscar el túnel de la sala
        if: matrix.rol != 'sala'
        run: |
          ID=""
          for i in $(seq 1 300); do
            ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq ".artifacts[] | select(.name==\"tunel-$VERSION\") | .id" 2>/dev/null | head -1)
            [ -n "$ID" ] && break; sleep 5
          done
          [ -n "$ID" ] || { echo "no apareció el túnel"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ID/zip" > t.zip && unzip -o -q t.zip -d tunel
          echo "BASE=$(cat tunel/url)" >> "$GITHUB_ENV"
      - name: Clase de prueba
        working-directory: prueba-sala
        run: |
          R="${{ matrix.rol }}"
          if [ "$R" = sala ]; then ROL=director G=0 OUT="$GITHUB_WORKSPACE/resultados-$VERSION" node carga.mjs
          else ROL=grupo G="${R#g}" node carga.mjs; fi
      - name: Resumen
        if: always() && matrix.rol == 'sala'
        run: cat "resultados-$VERSION/resumen.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "sin resumen" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && matrix.rol == 'sala'
        with:
          name: resultados-${{ matrix.v.nombre }}
          path: resultados-${{ matrix.v.nombre }}
