# Arcanos menores pendientes (sin config.json en hermes-videos): Modal (cuenta tarot) hace escenas con Gemini + revisión
# + render y deja el mp4 en la release "entregas" de hermes-videos. Solo con calendario=si, además los suma al calendario
# (agregar.mjs) y el publicador los saca cuando tengan "v2". De a una tanda para no pasar el cupo gratis de Gemini.
#   gh workflow run menores-diario -R matiasosuna/hermes-media -f cartas=64        (escenas + render, sin calendario)
name: menores-diario
on:
  # sin cron desde 2026-10-24: nada por adelantado (las escenas se hacen cuando la carta se acerca)
  workflow_dispatch:
    inputs:
      tanda: { description: 'cuántas cartas (si no se eligen)', default: '6' }
      cartas: { description: 'cartas puntuales, ej. "64 65" (vacío = las primeras pendientes)', default: '' }
      calendario:
        description: 'sumarlas al calendario (después se publican solas)'
        type: choice
        options: ['no', 'si']
        default: 'no'
jobs:
  tanda:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with: { repository: matiasosuna/hermes-videos, token: '${{ secrets.PRIVADO_TOKEN }}' }
      - name: Modal
        env:
          MODAL_TOKEN_ID: '${{ secrets.MODAL_TOKEN_ID }}'
          MODAL_TOKEN_SECRET: '${{ secrets.MODAL_TOKEN_SECRET }}'
          CARTAS: '${{ inputs.cartas }}'
          TANDA: '${{ inputs.tanda || 6 }}'
          CALENDARIO: "${{ inputs.calendario || 'no' }}"
        run: |
          set -o pipefail
          P=""; for n in $(seq 22 77); do [ -f src/carta-$n/timeline.json ] && [ ! -f src/carta-$n/config.json ] && P="$P $n"; done
          T=$(echo ${CARTAS:-$(echo $P | tr ' ' '\n' | head -$TANDA)} | tr '\n' ' ' | xargs)
          echo "pendientes:$P → hoy: $T · calendario: $CALENDARIO" | tee -a "$GITHUB_STEP_SUMMARY"
          [ -z "$T" ] && exit 0
          [[ "$T" =~ ^[0-9]{2}( [0-9]{2})*$ ]] || { echo "cartas inválidas: $T"; exit 1; }
          PUB=--no-publicar; [ "$CALENDARIO" = si ] && PUB=
          pip install -q modal
          # ::main porque modal_render.py tiene varios local_entrypoint: sin eso "modal run" sale con 1 sin hacer nada
          # (así fallaron las corridas del 19 al 23/10, con la salida tirada a /dev/null)
          rc=0; modal run scripts/modal_render.py::main --cartas "$T" --escenas $PUB 2>&1 | tee modal.log || rc=$?
          { echo '```'; tail -40 modal.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [ "$rc" = 0 ] && ! grep -qE '^ERROR |^[0-9]{2}: no pasó Gemini' modal.log
