# Renderiza una historia de IG hecha en HTML (1080x1920) con el Chrome del runner, no en la Mac. Se baja como artefacto "historia".
# Con publicar=si, además la sube al release "videos" como JPG y la publica en @hermestarot444.
#   gh workflow run historia -R matiasosuna/hermes-media -f archivo=imagenes/hito-5000.html
#   gh workflow run historia -R matiasosuna/hermes-media -f archivo=imagenes/hito-5000.html -f publicar=si
name: historia
on:
  workflow_dispatch:
    inputs:
      archivo:
        description: HTML de la historia (ruta en el repo)
        required: true
        default: imagenes/hito-5000.html
      tamano:
        description: Ancho,alto en px (historia de IG 1080,1920; imagen al compartir 1200,630)
        required: false
        default: "1080,1920"
      escala:
        description: Escala (3 = pantalla de celular nítida, p. ej. 390,1010 con escala 3)
        required: false
        default: "1"
      publicar:
        description: Publicarla en Instagram (si/no)
        required: true
        default: "no"
        type: choice
        options: ["no", "si"]
permissions:
  contents: write
jobs:
  historia:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Renderizar
        env:
          ARCHIVO: ${{ inputs.archivo }}
          TAMANO: ${{ inputs.tamano || '1080,1920' }}
          ESCALA: ${{ inputs.escala || '1' }}
        run: |
          [[ "$TAMANO" =~ ^[0-9]{2,4},[0-9]{2,4}$ && "$ESCALA" =~ ^[1-4]$ ]] || { echo "tamano/escala inválidos"; exit 1; }
          google-chrome --headless=new --disable-gpu --hide-scrollbars --force-device-scale-factor="$ESCALA" \
            --window-size="$TAMANO" --virtual-time-budget=10000 --screenshot="$PWD/historia.png" "file://$PWD/$ARCHIVO"
          file historia.png
      - uses: actions/upload-artifact@v4
        with:
          name: historia
          path: historia.png
      - name: Publicar en Instagram
        if: inputs.publicar == 'si'
        env:
          ARCHIVO: ${{ inputs.archivo }}
          GH_TOKEN: ${{ github.token }}
          HT_PAGE_TOKEN: ${{ secrets.HT_PAGE_TOKEN }}
          HT_IG_USER_ID: ${{ secrets.HT_IG_USER_ID }}
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          JPG="historia-$(basename "$ARCHIVO" .html).jpg"
          ffmpeg -loglevel error -y -i historia.png -q:v 2 "$JPG"
          gh release upload videos "$JPG" --clobber -R "$GITHUB_REPOSITORY"
          node historia-publicar.mjs "https://github.com/$GITHUB_REPOSITORY/releases/download/videos/$JPG"
