# Status diario (calendario + métricas de IG, YouTube, TikTok y la web) → STATUS.md en el repo privado hermes-videos.
name: status
on:
  schedule: [{ cron: '0 13 * * *' }]
  workflow_dispatch:
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/checkout@v4
        with: { repository: matiasosuna/hermes-videos, path: privado, token: '${{ secrets.PRIVADO_TOKEN }}', sparse-checkout: STATUS.md }
      - name: crédito de Modal
        env: { MODAL_TOKEN_ID: '${{ secrets.MODAL_TOKEN_ID }}', MODAL_TOKEN_SECRET: '${{ secrets.MODAL_TOKEN_SECRET }}' }
        run: |
          pip install -q modal
          modal billing summary --json > m.json 2>m.err || true
          node -e "let o;try{const d=require('./m.json'),c=-Number(d.adjustments.credits),b=Number(d.billed_cost);o={texto:'USD '+c.toFixed(2)+' usados · quedan ~USD '+(30-c).toFixed(2)+(b>0?' · ⚠️ cobrado USD '+b.toFixed(2):'')}}catch(e){o={error:require('fs').readFileSync('m.err','utf8').slice(-120)}}require('fs').writeFileSync('modal.json',JSON.stringify(o))"
      - name: armar STATUS.md
        env:
          HT_PAGE_TOKEN: ${{ secrets.HT_PAGE_TOKEN }}
          HT_IG_USER_ID: ${{ secrets.HT_IG_USER_ID }}
          HT_YT_CLIENT_ID: ${{ secrets.HT_YT_CLIENT_ID }}
          HT_YT_CLIENT_SECRET: ${{ secrets.HT_YT_CLIENT_SECRET }}
          HT_YT_REFRESH_TOKEN: ${{ secrets.HT_YT_REFRESH_TOKEN }}
          HT_STATS_TOKEN: ${{ secrets.HT_STATS_TOKEN }}
          PRIVADO_TOKEN: ${{ secrets.PRIVADO_TOKEN }}
        run: node status.mjs > privado/STATUS.md
      - name: guardar
        run: |
          cd privado && git config user.name hermes-bot && git config user.email hermes-bot@users.noreply.github.com
          git add STATUS.md && git commit -qm "Status $(date -u +%F)" && git push -q || echo "sin cambios"
