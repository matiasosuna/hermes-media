# Renderiza las destacadas y stories del Tarot Club (imagenes/club-ig/slide.html?s=<id>) con el Chrome del runner, no en la Mac.
# Se bajan como artefacto "club-ig" (PNG 1080x1920). No publica nada.
#   gh workflow run club-ig -R matiasosuna/hermes-media --ref club-ig -f ids="club-1 club-study"
name: club-ig
on:
  push:
    branches: [club-ig]
    paths: ['imagenes/club-ig/**', '.github/workflows/club-ig.yml']
  workflow_dispatch:
    inputs:
      ids:
        description: Ids separados por espacio (vacío = todos)
        required: false
        default: ""
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Renderizar
        env:
          IDS: ${{ inputs.ids || '' }}
        run: |
          set -euo pipefail
          T=imagenes/club-ig/slide.html
          [ -n "$IDS" ] || IDS=$(grep -oE "^  '[a-z0-9-]+':" "$T" | tr -d "': " | grep -vx 'qa-fecha')  # qa-fecha solo con fecha cargada
          mkdir -p out
          for id in $IDS; do
            [[ "$id" =~ ^[a-z0-9-]+$ ]] || { echo "id inválido: $id"; exit 1; }
            google-chrome --headless=new --disable-gpu --hide-scrollbars --window-size=1080,1920 --virtual-time-budget=15000 \
              --screenshot="$PWD/out/$id.png" "file://$PWD/$T?s=$id" 2>/dev/null
            echo "ok $id"
          done
          ls -la out
      - name: Hoja de contacto
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          n=$(ls out/*.png | wc -l); c=6; f=$(( (n + c - 1) / c ))
          ffmpeg -loglevel error -y -pattern_type glob -i 'out/*.png' -vf "scale=360:640,tile=${c}x${f}:padding=8:color=white" -frames:v 1 hoja.jpg
      - name: Post del feed (1080x1350)
        run: |
          mkdir -p post
          google-chrome --headless=new --disable-gpu --hide-scrollbars --window-size=1080,1350 --virtual-time-budget=15000 \
            --screenshot="$PWD/post/post-club.png" "file://$PWD/imagenes/club-ig/post.html" 2>/dev/null
          ls -la post
      - uses: actions/upload-artifact@v4
        with:
          name: club-ig
          path: |
            out/*.png
            hoja.jpg
            post/*.png
