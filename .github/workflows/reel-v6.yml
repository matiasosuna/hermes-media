# Reels con el motor v6 (muñeco + escenografía de src/munecos2), de a una carta. Reemplaza al cron viejo de Modal
# (hermes-render · cola, apagado el 17/11 porque renderizaba desde main con el motor viejo).
#   1) gh workflow run reel-v6 -R matiasosuna/hermes-media -f carta=45
#        → render en Modal + subida al release "videos" + hoja de revisión (hermes-videos, release entregas/NN-v6-hoja.jpg).
#          No toca el calendario. Falla si src/carta-NN/escenas.tsx no usa src/munecos2.
#   2) revisar la hoja / el video
#   3) gh workflow run reel-v6 -R matiasosuna/hermes-media -f carta=45 -f agendar=2026-11-19T12:00:00-05:00
#        → la suma al calendario con "v2" solo si el video del release es el mismo que salió del paso 1.
name: reel-v6
on:
  workflow_dispatch:
    inputs:
      carta: { description: 'número de carta, ej. 45', required: true }
      agendar: { description: 'vacío = solo renderizar · fecha ISO (ej. 2026-11-19T12:00:00-05:00) = agendar lo ya renderizado', default: '' }
concurrency:
  group: reel-v6
  cancel-in-progress: false
jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { repository: matiasosuna/hermes-videos, token: '${{ secrets.PRIVADO_TOKEN }}' }
      - name: Modal
        env:
          MODAL_TOKEN_ID: '${{ secrets.MODAL_TOKEN_ID }}'
          MODAL_TOKEN_SECRET: '${{ secrets.MODAL_TOKEN_SECRET }}'
          NN: '${{ inputs.carta }}'
          CUANDO: '${{ inputs.agendar }}'
        run: |
          set -o pipefail
          [[ "$NN" =~ ^[0-9]{2}$ ]] || { echo "carta inválida: $NN"; exit 1; }
          pip install -q modal
          if [ -z "$CUANDO" ]; then
            grep -q munecos2 src/carta-$NN/escenas.tsx || { echo "src/carta-$NN/escenas.tsx no usa el motor v6"; exit 1; }
            modal run scripts/modal_render.py::reel_v6 --nn "$NN" 2>&1 | tee modal.log
          else
            modal run scripts/modal_render.py::agendar_v6 --nn "$NN" --cuando "$CUANDO" 2>&1 | tee modal.log
          fi
          { echo '```'; tail -20 modal.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
