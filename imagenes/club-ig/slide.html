<!doctype html><html><head><meta charset="utf-8">
<!-- Destacadas y stories del Tarot Club en IG (plan: puentes/tarot docs/club-en-instagram.md, 15/11/2026).
     Una sola plantilla: slide.html?s=<id>. Ids en SLIDES (abajo). 1080x1920; todo el texto entre y=250 y 1600 (IG tapa arriba y abajo).
     Cartas: hermestarot444.com/cartas/<id>.jpg (Rider–Waite de la web). Se renderiza en GitHub Actions (workflow club-ig), nunca en la Mac.
     Todo lo del Club dice «Reply CLUB», sin sticker de link (Matías, 8/11 y 11/11). Precio: como la historia 3 (sin contador de lugares). -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=EB+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{--noche:#12142E;--dorado:#F2B84B;--crema:#F6EBD2}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:radial-gradient(ellipse at 50% 36%,#2a2d5e 0%,var(--noche) 58%,#08091a 100%);color:var(--crema);font-family:'EB Garamond',serif;overflow:hidden;position:relative}
.estrellas{position:absolute;inset:0}
.estrellas i{position:absolute;border-radius:50%;background:#fff}
.k{position:absolute;top:262px;width:100%;text-align:center;font-family:Cinzel;font-weight:700;letter-spacing:10px;color:var(--dorado);font-size:30px;opacity:.9}
.arte{position:absolute;top:350px;left:0;width:100%;height:800px;display:flex;justify-content:center;align-items:center}
.carta{height:760px;border-radius:18px;border:3px solid var(--dorado);box-shadow:0 0 70px rgba(242,184,75,.35),0 30px 60px rgba(0,0,0,.55)}
.abanico{position:relative;width:900px;height:800px}
.abanico img{position:absolute;top:60px;left:50%;height:640px;border-radius:16px;border:3px solid var(--dorado);box-shadow:0 0 50px rgba(242,184,75,.3),0 24px 50px rgba(0,0,0,.6);transform-origin:50% 120%}
.grilla{display:grid;grid-template-columns:repeat(13,62px);gap:8px;padding:10px}
.grilla img{width:62px;height:107px;object-fit:cover;border-radius:5px;border:1px solid rgba(242,184,75,.55)}
h1{text-align:center;font-family:Cinzel;font-weight:700;font-size:96px;line-height:1;letter-spacing:4px;color:var(--dorado);text-shadow:0 0 50px rgba(242,184,75,.45)}
.abajo{position:absolute;top:1185px;left:80px;right:80px;display:flex;flex-direction:column;align-items:center;gap:30px}
h1.largo{font-size:78px}
.l{text-align:center;font-style:italic;font-size:54px;line-height:1.18;text-wrap:balance;margin-top:-6px}
.niveles{text-align:center;white-space:nowrap;font-family:Cinzel;font-weight:700;font-size:24px;letter-spacing:4px;color:var(--dorado);opacity:.85}
.cta{text-align:center;font-style:italic;font-size:58px;margin-top:14px}
.cta b{font-family:Cinzel;font-style:normal;font-weight:700;font-size:80px;color:var(--dorado);letter-spacing:3px;text-shadow:0 0 40px rgba(242,184,75,.45)}
.cta.chico{font-family:Cinzel;font-style:normal;font-weight:700;font-size:34px;letter-spacing:5px;color:var(--dorado);margin-top:30px}
/* precio */
.precio{position:absolute;top:560px;width:100%;text-align:center}
.precio .et{font-family:Cinzel;font-weight:700;font-size:40px;letter-spacing:8px;color:var(--dorado)}
.precio .n{font-family:Cinzel;font-weight:700;font-size:250px;line-height:1.05;color:var(--dorado);text-shadow:0 0 70px rgba(242,184,75,.5)}
.precio .n small{font-size:70px;letter-spacing:2px}
.precio .m{font-style:italic;font-size:56px;margin-top:6px}
.precio .luego{margin-top:70px;font-size:46px;opacity:.9}
.precio .pill{display:inline-block;margin-top:60px;padding:16px 42px;border:2.5px solid var(--dorado);border-radius:999px;font-family:Cinzel;font-weight:700;font-size:28px;letter-spacing:4px;color:var(--dorado)}
/* fecha del Q&A */
.fecha{text-align:center}
.fecha .d{font-family:Cinzel;font-weight:700;font-size:62px;color:var(--crema);letter-spacing:2px}
.fecha .zonas{margin-top:22px;font-size:40px;line-height:1.35;opacity:.92}
/* portadas de destacadas: solo el círculo del centro */
.portada{position:absolute;top:50%;left:50%;width:760px;height:760px;margin:-380px 0 0 -380px;border-radius:50%;border:10px solid var(--dorado);display:flex;align-items:center;justify-content:center;box-shadow:0 0 90px rgba(242,184,75,.35),inset 0 0 90px rgba(242,184,75,.15)}
.portada span{font-family:Cinzel;font-weight:700;font-size:420px;line-height:1;color:var(--dorado);text-shadow:0 0 60px rgba(242,184,75,.5)}
</style></head><body>
<div class="estrellas" id="e"></div>
<main id="m"></main>
<script>
const C = (id) => `https://hermestarot444.com/cartas/${id}.jpg`;
const MINI = (id) => `https://hermestarot444.com/cartas/mini/${id}.webp`;
const CLUB = '<div class="cta">Reply <b>CLUB</b></div>';
const BIO = '<div class="cta chico">LINK IN BIO</div>';
const carta = (id) => `<div class="arte"><img class="carta" src="${C(id)}"></div>`;
const SLIDES = {
  // ---- destacada «Club» (y stories del Club) ----
  'club-1': { k: '☿ HERMES TAROT 444', arte: () => `<div class="arte"><div class="abanico">${[['X', -20, -170], ['XXI', 0, 0], ['XIX', 20, 170]].map(([id, g, dx], i) =>
      `<img src="${C(id)}" style="transform:translateX(calc(-50% + ${dx}px)) rotate(${g}deg);z-index:${i === 1 ? 2 : 1}">`).join('')}</div></div>`,
    h: 'TAROT CLUB', l: 'A study plan, with Hermes.', cta: CLUB },
  'club-study': { k: '☿ TAROT CLUB', arte: () => `<div class="arte"><div class="grilla">${MAZO.map((id) => `<img src="${MINI(id)}">`).join('')}</div></div>`,
    h: 'STUDY', l: 'All 78 cards, in depth.', niveles: 'BEGINNER → INTERMEDIATE → ADVANCED → EXPERT', cta: CLUB },
  'club-journey': { k: '☿ TAROT CLUB', arte: () => carta('0'), h: 'YOUR JOURNEY', l: 'Exercises for your level, with feedback from Hermes.', cta: CLUB },
  'club-practices': { k: '☿ TAROT CLUB', arte: () => carta('XVII'), h: 'SPIRITUAL PRACTICES', l: 'To do and to track.', cta: CLUB },
  'club-tools': { k: '☿ TAROT CLUB', arte: () => carta('I'), h: 'TOOLS', l: 'Hermes Journal · Card table', cta: CLUB },
  'club-recordings': { k: '☿ TAROT CLUB', arte: () => carta('IX'), h: 'RECORDINGS', l: 'Guided exercises and meditations by Hermes.', cta: CLUB },
  'club-precio': { k: '☿ TAROT CLUB', html: () => `<div class="precio"><div class="et">FOUNDER PRICE</div>
      <div class="n"><small>USD</small> 11</div><div class="m">per month · locked in while you stay</div>
      <div class="luego">Next: USD 22 · From Dec 1: USD 44</div><div class="pill">ONLY 10 FOUNDER SPOTS</div></div>`, cta: CLUB },
  // ---- destacada «Live Q&A» ----
  'qa-1': { k: '☿ FREE · FOR EVERYONE', arte: () => carta('V'), h: 'LIVE Q&A', l: 'Bring your tarot question. Hermes answers live.', cta: BIO },
  'qa-2': { k: '☿ LIVE Q&A', arte: () => carta('II'), h: 'ASK BEFORE', l: 'A card, a spread, a reading you didn’t understand. Leave it on the web.', cta: BIO },
  // story del Q&A con la fecha cargada en el panel (/api/clases.js); sin fecha, el render falla a propósito y no se publica
  'qa-fecha': { k: '☿ FREE · FOR EVERYONE', arte: () => carta('V'), h: 'NEXT LIVE Q&A', fecha: true, cta: BIO },
  // muestra para revisar el diseño (fecha de ejemplo, no se publica)
  'qa-fecha-muestra': { k: '☿ FREE · FOR EVERYONE', arte: () => carta('V'), h: 'NEXT LIVE Q&A', fecha: { fecha: '2026-11-22', h: 16, mi: 44 }, cta: BIO },
  // ---- portadas ----
  'portada-club': { portada: '☿' },
  'portada-qa': { portada: '?' },
};
const MAZO = ['0', ...'I II III IV V VI VII VIII IX X XI XII XIII XIV XV XVI XVII XVIII XIX XX XXI'.split(' '),
  ...['W', 'C', 'S', 'P'].flatMap((p) => Array.from({ length: 14 }, (_, i) => p + (i + 1)))];

function fechaHtml(c) {
  // c = { fecha:'YYYY-MM-DD', h, mi, tz } en hora de Nueva York (worker/control.js)
  const iso = `${c.fecha}T${String(c.h).padStart(2, '0')}:${String(c.mi).padStart(2, '0')}:00`;
  const ny = new Date(new Date(iso + 'Z').getTime() - offset(iso, 'America/New_York'));
  const f = (tz, o) => new Intl.DateTimeFormat('en-US', { timeZone: tz, ...o }).format(ny);
  const dia = f('America/New_York', { weekday: 'long', month: 'long', day: 'numeric' });
  const hora = (tz) => f(tz, { hour: 'numeric', minute: '2-digit' });
  return `<div class="fecha"><div class="d">${dia}</div><div class="zonas">${hora('America/New_York')} New York · ${hora('Europe/London')} London<br>${hora('Asia/Kolkata')} India</div></div>`;
}
function offset(iso, tz) { // ms que tz está detrás de UTC en esa fecha
  const d = new Date(iso + 'Z');
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' }).formatToParts(d).map((x) => [x.type, x.value]));
  return Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second) - d.getTime();
}

(async () => {
  let s = 11; const r = () => (s = (s * 9301 + 49297) % 233280) / 233280; const e = document.getElementById('e');
  for (let i = 0; i < 140; i++) { const d = document.createElement('i'); d.style.left = r() * 1080 + 'px'; d.style.top = r() * 1920 + 'px'; const z = 1 + r() * 3; d.style.width = d.style.height = z + 'px'; d.style.opacity = .2 + r() * .6; e.appendChild(d); }
  const id = new URLSearchParams(location.search).get('s');
  const x = SLIDES[id]; const m = document.getElementById('m');
  if (!x) { m.innerHTML = `<h1>NO SLIDE ${id}</h1>`; return; }
  if (x.portada) { m.innerHTML = `<div class="portada"><span>${x.portada}</span></div>`; return; }
  const arriba = `<div class="k">${x.k}</div>` + (x.arte ? x.arte() : '') + (x.html ? x.html() : '');
  let abajo = (x.h ? `<h1${x.h.length > 12 ? ' class="largo"' : ''}>${x.h}</h1>` : '') + (x.l ? `<p class="l">${x.l}</p>` : '') +
    (x.niveles ? `<div class="niveles">${x.niveles}</div>` : '');
  const cta = x.cta || '';
  if (x.fecha) {
    const ahora = Date.now(); let prox = typeof x.fecha === 'object' ? x.fecha : null;
    if (!prox) try { await new Promise((ok, mal) => { const sc = document.createElement('script'); sc.src = 'https://hermestarot444.com/api/clases.js'; sc.onload = ok; sc.onerror = mal; document.head.appendChild(sc); });
      prox = (window.CLASSES_DB || []).find((c) => new Date(`${c.fecha}T23:59:59Z`).getTime() >= ahora); } catch {}
    if (!prox) { document.title = 'SIN-FECHA'; m.innerHTML = '<div class="abajo"><h1>NO Q&A DATE</h1></div>'; return; }
    abajo += fechaHtml(prox);
  }
  m.innerHTML = arriba + `<div class="abajo">${abajo}${cta}</div>`;
})();
</script>
</body></html>
